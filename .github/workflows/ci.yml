name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Dummy build-time values only. `next build` inlines NEXT_PUBLIC_* vars and
      # therefore requires them to exist, but the build performs no Supabase
      # queries (no generateStaticParams, every data route is dynamic, and every
      # createClient() call happens inside a request handler). No real
      # credential is used or needed here — CI holds zero production secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned to the runtime the project is verified against locally,
          # rather than the runner's floating default.
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
